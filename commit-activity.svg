<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" role="img" aria-label="4ofl commit activity telemetry">
  <defs>
    <filter id="activity-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d47455" stop-opacity="0" />
      <stop offset="50%" stop-color="#d47455" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d47455" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      fill: #8c8a85;
    }
    .head {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 500;
    }
    .accent { fill: #d47455; }
    .bone { fill: #edece8; }
    .muted { fill: #8c8a85; }

    /* Heatmap Levels */
    .c0 { fill: #16161d; }
    .c1 { fill: #381f18; }
    .c2 { fill: #6e3220; }
    .c3 { fill: #a94a2d; }
    .c4 { fill: #d47455; }

    /* Peak Activity Pulsing */
    .pulse-peak {
      animation: pulse-glow 2.5s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 3px rgba(212, 116, 85, 0.7)); }
    }

    /* Radar Scanline Animation */
    .radar-sweep {
      animation: sweep 8s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(820px); }
    }
    ]]>
  </style>

  <!-- Background Card -->
  <rect x="0.75" y="0.75" width="798.5" height="158.5" rx="8" fill="#0b0b0d" stroke="#24242c" stroke-width="1.5" />

  <!-- Header Telemetry Bar -->
  <g transform="translate(24, 26)">
    <text class="head">
      <tspan class="accent">commit_velocity</tspan>
      <tspan class="muted"> // rolling 40 weeks</tspan>
    </text>
    <text x="752" y="0" text-anchor="end" class="mono">
      <tspan class="muted">last 9 mos: </tspan>
      <tspan class="bone">614 commits</tspan>
      <tspan class="muted"> · </tspan>
      <tspan class="accent">41d streak</tspan>
    </text>
  </g>

  <line x1="24" y1="38" x2="776" y2="38" stroke="#1c1c24" stroke-width="1" />

